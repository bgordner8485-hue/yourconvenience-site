name: Deploy website
on:
  push:
    branches: [main]
    paths: ["public/**"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      # Winner montage videos live as GitHub Release files; copy the latest ones into the site.
      - name: Add latest winner montages
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p public/videos
          gh release download montages --pattern "*-latest.mp4" --dir public/videos --clobber \
            || echo "No montages published yet — skipping."
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - uses: actions/deploy-pages@v4
