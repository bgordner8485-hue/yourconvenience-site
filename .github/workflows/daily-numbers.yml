name: Daily winning numbers
on:
  schedule:
    # 13:00 UTC = 9am Eastern in summer, 8am in winter. Late enough to include
    # the previous night's Powerball and Mega Millions draws (10:59pm ET).
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Build the card but do not post"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: { group: daily-numbers }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Build and post the numbers card
        run: python automation/daily_numbers.py ${{ inputs.dry && '--dry' || '' }}
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: daily-numbers, path: out/daily-numbers.jpg, if-no-files-found: ignore }
